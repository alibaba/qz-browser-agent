name: npm package

on:
  pull_request:
    paths:
      - services/mcp-bridge/**
      - tests/unit/test-*mcp*.mjs
      - tests/unit/test-qz-*.mjs
      - tests/release/npm-package.mjs
      - tests/runner/**
      - tests/support/observation-timers.mjs
      - package.json
      - package-lock.json
      - .github/workflows/npm-package.yml
  push:
    branches: [main]
    paths:
      - services/mcp-bridge/**
      - tests/unit/test-*mcp*.mjs
      - tests/unit/test-qz-*.mjs
      - tests/release/npm-package.mjs
      - tests/runner/**
      - tests/support/observation-timers.mjs
      - package.json
      - package-lock.json
      - .github/workflows/npm-package.yml
  workflow_dispatch:
    inputs:
      version:
        description: Expected version in services/mcp-bridge/package.json
        required: true
        type: string
      publish:
        description: Publish the tested tarball to npm (main only)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        include:
          - os: ubuntu-latest
            node: '22.0.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const { version } = JSON.parse(readFileSync('services/mcp-bridge/package.json', 'utf8'));
          if (process.env.RELEASE_VERSION) assert.equal(version, process.env.RELEASE_VERSION);
          if (process.env.PUBLISH_REQUESTED === 'true') assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          console.log(`Checking qz-browser-agent ${version}`);
          NODE
      - run: npm ci
      - name: Select package runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: CLI and MCP regressions
        # Install the repository toolchain on Node 24, then run the package's
        # JavaScript tests directly without the extension's build/TS loaders.
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { createSuiteCatalog } from './tests/runner/suites.mjs';
          const catalog = createSuiteCatalog({ root: process.cwd(), match: 'node', unitConcurrency: 1 });
          const commands = catalog.filteredCommands('services');
          assert.equal(commands.length, 1);
          for (const command of commands) {
            assert.equal(command.bin, 'node');
            const result = spawnSync(process.execPath, command.args, { stdio: 'inherit' });
            if (result.error) throw result.error;
            assert.equal(result.status, 0, `CLI and MCP regressions failed on ${process.version}`);
          }
          NODE
      - name: Install and exercise the npm tarball
        run: node tests/release/npm-package.mjs --output tests/results/npm/package.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux' && matrix.node == '24'
        with:
          name: qz-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/results/npm/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qz-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: npm-artifact
      - run: npm publish npm-artifact/package.tgz --access public --registry=https://registry.npmjs.org
