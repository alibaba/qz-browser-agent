<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="core.brand">轻舟</title>
  <link rel="icon" href="data:,">
  <link id="qingzhou-sidepanel-skin" rel="stylesheet" href="sidepanel.css" data-qingzhou-skin="default">
</head>
<body>
  <template id="data-consent-template">
    <section class="data-consent qz-scroll qz:p-5 qz:bg-surface qz:text-body" aria-labelledby="data-consent-title">
      <div class="qz:mx-auto qz:flex qz:w-full qz:max-w-96 qz:flex-col qz:gap-4">
        <div class="welcome-icon" aria-hidden="true"></div>
        <h1 id="data-consent-title"></h1>
        <p data-i18n="core.dataConsentModel"></p>
        <p data-i18n="core.dataConsentLocation"></p>
        <p data-i18n="core.dataConsentStorage"></p>
        <p data-i18n="core.dataConsentServices"></p>
        <a href="https://github.com/alibaba/qz-browser-agent/blob/main/docs/permissions.md" target="_blank" rel="noopener noreferrer" data-i18n="core.dataConsentDetails"></a>
        <div class="qz:flex qz:flex-col qz:gap-2">
          <button type="button" class="qz-btn qz-btn--primary qz-btn--lg" data-consent-accept data-i18n="core.dataConsentAccept"></button>
          <button type="button" class="qz-btn qz-btn--ghost qz-btn--lg" data-consent-later data-i18n="core.dataConsentLater"></button>
        </div>
        <p role="alert" class="qz:text-danger" data-consent-error></p>
      </div>
    </section>
  </template>
  <div id="app" class="qz:relative qz:flex qz:h-full qz:min-h-0 qz:w-full qz:flex-col qz:overflow-hidden qz:rounded-none qz:bg-surface" data-workspace-booting>
    <div id="workspace-boot-fallback" class="workspace-boot-fallback hidden" role="alert"></div>
    <!-- Header -->
    <header id="header" class="qz:relative qz:z-10 qz:grid qz:items-center">
      <div class="header-left qz:flex qz:min-w-0 qz:items-center qz:gap-2.5">
        <nav class="qz-segment header-tabs">
          <button class="qz-segment-item tab-btn active" data-tab="chat" data-i18n="core.chat">对话</button>
        </nav>
      </div>
      <div class="header-actions qz:flex qz:flex-none qz:min-w-max qz:justify-end">
        <button id="btn-case-recording" class="qz-icon-btn qz-icon-btn--md icon-btn hidden" title="录制 case" data-i18n-title="core.recordCase">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
          </svg>
        </button>
        <button id="btn-new" class="qz-icon-btn qz-icon-btn--md icon-btn" title="新对话" data-i18n-title="core.newChat">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        
        <button id="btn-settings" class="qz-icon-btn qz-icon-btn--md icon-btn" title="设置" data-i18n-title="core.settings">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9.4 4.2 10 2h4l.6 2.2c.2.1.5.2.7.3l2.1-1.1 2.8 2.8-1.1 2.1.3.7 2.2.6v4l-2.2.6-.3.7 1.1 2.1-2.8 2.8-2.1-1.1-.7.3-.6 2.2h-4l-.6-2.2-.7-.3-2.1 1.1-2.8-2.8 1.1-2.1-.3-.7-2.2-.6v-4L4.6 9l.3-.7-1.1-2.1 2.8-2.8 2.1 1.1.7-.3Z"/>
            <circle cx="12" cy="12" r="3.2"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="session-title-bar" class="session-title-bar hidden qz:flex qz:min-h-8.5 qz:flex-none qz:items-center qz:gap-2" aria-live="polite">
      <div class="session-title-editor qz:flex qz:h-6 qz:min-w-0 qz:flex-auto qz:items-center">
        <button id="btn-edit-session-title" class="qz-btn qz-btn--inline session-title-edit-trigger" type="button" title="重命名对话" data-i18n-title="core.renameConversation" aria-label="重命名对话" data-i18n-aria-label="core.renameConversation" aria-expanded="false" aria-controls="session-title-input">
          <span id="current-session-title" class="qz:block qz:min-w-0 qz:max-w-full qz:truncate"></span>
        </button>
        <input id="session-title-input" class="qz-field qz-field--bare session-title-input" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="对话标题" data-i18n-aria-label="core.conversationTitle">
      </div>
      <div class="session-title-actions qz:flex qz:flex-none qz:items-center qz:gap-0.5">
        <div id="chat-text-size-control" class="chat-text-size-control qz:relative qz:flex-none">
          <button id="btn-chat-text-size" class="qz-icon-btn qz-icon-btn--sm chat-text-size-trigger" type="button" title="对话字号" data-i18n-title="core.chatTextSize" aria-label="对话字号" data-i18n-aria-label="core.chatTextSize" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat-text-size-popover">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="currentColor" stroke="currentColor" stroke-width="24" stroke-linejoin="round" class="chat-text-size-glyph" aria-hidden="true">
              <path d="M377.301333 203.648a19.114667 19.114667 0 0 0-17.92-12.117333h-38.613333a19.328 19.328 0 0 0-17.92 12.117333L65.109333 798.378667a19.370667 19.370667 0 0 0 17.92 26.88h16.170667c8.106667 0 15.232-4.906667 17.92-12.074667l58.794667-146.218667a19.114667 19.114667 0 0 1 17.92-12.117333h289.28c7.68 0 14.805333 4.48 17.92 12.117333l58.794666 146.645334a19.114667 19.114667 0 0 0 17.92 12.117333h19.754667a19.712 19.712 0 0 0 17.92-26.88L377.344 203.648z m69.973334 399.189333H226.56a19.370667 19.370667 0 0 1-17.92-26.922666l111.701333-283.008c6.698667-16.64 30.037333-16.64 36.309334 0l108.970666 283.434666a19.541333 19.541333 0 0 1-18.346666 26.453334z m512.170666 123.776v-209.024c-2.218667-93.738667-54.698667-141.696-157.44-143.957333-85.632 0-138.581333 32.725333-158.72 98.218667a19.712 19.712 0 0 0 18.773334 25.130666h14.378666c8.533333 0 16.170667-5.376 18.389334-13.909333 11.221333-40.832 47.104-61.44 106.752-61.44 65.92-2.261333 100.48 28.245333 102.698666 92.373333v21.546667c0 10.752-8.533333 19.285333-19.285333 19.285333h-31.36c-68.650667 2.218667-117.973333 9.386667-147.584 20.608-57.429333 25.173333-87.04 67.754667-89.258667 126.933334 4.48 81.664 53.376 125.141333 145.792 130.090666h3.584c65.450667-4.949333 110.336-26.453333 135.424-65.024l3.584-6.741333 2.261334 46.634667c.426667 10.325333 8.96 18.389333 19.285333 18.389333h14.336a19.456 19.456 0 0 0 19.285333-21.504 495.872 495.872 0 0 1-.853333-77.610667z m-184.746666 64.597334c-64.170667-2.261333-97.365333-32.298667-99.584-89.258667-2.261333-68.608 63.658667-101.376 199.125333-99.114667h12.117333c10.325333 0 19.285333 8.533333 19.285334 18.816 1.365333 110.805333-42.154667 167.296-130.986667 169.557334z"/>
            </svg>
          </button>
          <div id="chat-text-size-popover" class="qz-popover chat-text-size-popover hidden qz:absolute qz:top-[calc(100%+5px)] qz:-end-6.5 qz:z-70 qz:grid qz:w-28 qz:grid-cols-[26px_minmax(0,1fr)_26px] qz:items-center qz:gap-0.25 qz:p-0.75" role="dialog" aria-label="调整对话字号" data-i18n-aria-label="core.adjustChatTextSize">
            <button class="qz-icon-btn qz-icon-btn--sm chat-text-size-step" type="button" data-chat-text-size-action="decrease" title="缩小对话字号" data-i18n-title="core.decreaseTextSize" aria-label="缩小对话字号" data-i18n-aria-label="core.decreaseTextSize">A−</button>
            <button id="chat-text-size-reset" class="qz-btn qz-btn--inline chat-text-size-value qz:h-6.5 qz:min-w-0 qz:px-0.5 qz:py-0" type="button" data-chat-text-size-action="reset" title="恢复标准字号" data-i18n-title="core.resetTextSize">100%</button>
            <button class="qz-icon-btn qz-icon-btn--sm chat-text-size-step" type="button" data-chat-text-size-action="increase" title="放大对话字号" data-i18n-title="core.increaseTextSize" aria-label="放大对话字号" data-i18n-aria-label="core.increaseTextSize">A+</button>
          </div>
        </div>
        <button id="btn-export-session" class="qz-icon-btn qz-icon-btn--sm session-title-export-btn" type="button" title="导出对话 HTML" data-i18n-title="core.exportHtml" aria-label="导出对话 HTML" data-i18n-aria-label="core.exportHtml">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2Z"/>
            <path d="M14 2v6h6M12 12v6m0 0 3-3m-3 3-3-3"/>
          </svg>
        </button>
      </div>
    </div>

    <section id="chat-search-bar" class="qz-popover chat-search-bar hidden qz:absolute qz:right-3 qz:z-60 qz:flex qz:min-h-9.5 qz:w-[min(360px,calc(100%-24px))] qz:items-center qz:gap-1 qz:p-1.25" role="search" aria-label="搜索对话" data-i18n-aria-label="core.searchConversation">
      <input id="chat-search-input" class="qz-field qz-field--bare chat-search-input qz:h-7 qz:min-w-0 qz:flex-auto qz:px-1.75 qz:py-0" type="search" autocomplete="off" placeholder="搜索对话" data-i18n-placeholder="core.searchConversation" aria-label="搜索对话" data-i18n-aria-label="core.searchConversation">
      <span id="chat-search-count" class="chat-search-count qz:min-w-10 qz:flex-none qz:text-center qz:select-none" aria-live="polite">0/0</span>
      <button id="chat-search-prev" class="qz-icon-btn qz-icon-btn--sm chat-search-btn" type="button" title="上一个" data-i18n-title="core.previous" aria-label="上一个搜索结果" data-i18n-aria-label="core.previousSearchResult">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 9.5 8 6l3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="chat-search-next" class="qz-icon-btn qz-icon-btn--sm chat-search-btn" type="button" title="下一个" data-i18n-title="core.next" aria-label="下一个搜索结果" data-i18n-aria-label="core.nextSearchResult">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="chat-search-close" class="qz-icon-btn qz-icon-btn--sm chat-search-btn" type="button" title="关闭" data-i18n-title="core.close" aria-label="关闭搜索" data-i18n-aria-label="core.closeSearch">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </section>

    <!-- Messages -->
    <main id="messages" data-chat-state="landing">
      <div id="welcome" class="welcome qz:flex qz:h-full qz:min-h-0 qz:flex-col qz:items-center qz:justify-start qz:text-center">
        <div class="welcome-brand qz:flex qz:flex-col qz:items-center">
          <div class="welcome-icon" aria-label="轻舟" data-i18n-aria-label="core.brand"></div>
          <p class="welcome-subtitle" data-i18n="core.tagline">万重山外，一舟轻渡</p>
        </div>
        
      </div>
    </main>

    <!-- Sessions panel -->

    <!-- Data panel -->

    <!-- Skills panel -->

    <!-- Logs panel -->

    <div id="chat-dock" class="chat-dock qz:flex-none">
      <!-- Status indicator -->
      <div id="status-bar" class="status-bar hidden qz:flex qz:min-h-7.5 qz:items-center qz:gap-2 qz:px-3.5 qz:pt-1.5 qz:pb-0">
        <div class="status-dot"></div>
        <span id="status-text" data-i18n="core.thinking">思考中...</span>
        <span id="context-usage" class="context-usage"></span>
        <button id="btn-abort" class="qz-icon-btn qz-icon-btn--secondary qz-icon-btn--xs abort-btn qz:ml-auto" title="停止" data-i18n-title="core.stop">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
        </button>
      </div>

      <!-- Input -->
      <footer id="input-area" class="qz:relative qz:px-2.5 qz:pt-1.75 qz:pb-1">
        <section id="goal-strip" class="goal-strip hidden" aria-live="polite"></section>
        <div data-ui-slot="composer-notices" class="qz:contents"></div>
        <div class="input-composer-frame qz:flex qz:min-w-0 qz:flex-col">
          <div id="queued-followups" class="queued-followups hidden" aria-live="polite"></div>
          <div class="input-wrapper qz:flex qz:items-center qz:gap-2">
            <button id="btn-pick-element" class="qz-icon-btn qz-icon-btn--sm element-picker-btn hidden" type="button" title="选择页面元素" data-i18n-title="core.selectElement" aria-label="选择页面元素" data-i18n-aria-label="core.selectElement" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12.034 12.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z"/>
                <path d="M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h2M14 3h1M3 9v1M21 9v2M3 14v1"/>
              </svg>
            </button>
            <textarea id="input" dir="auto" class="qz:min-h-5 qz:max-h-30 qz:flex-1 qz:resize-none qz:overflow-x-hidden qz:overflow-y-hidden" placeholder="这个任务要做什么？" data-i18n-placeholder="core.taskPlaceholder" rows="1"></textarea>
            <button id="btn-send" class="send-btn" type="button" aria-label="发送" data-i18n-aria-label="core.send" disabled>
              <span class="send-icon-stage" aria-hidden="true">
                <span class="send-vessel">
                  <svg class="send-mark" viewBox="0 0 32 32">
                    <g transform="rotate(-11.5 16 16)">
                      <path d="M10.3 3.9C16.6 5.8 21.4 9.6 23.8 14.7c2-1 4-2.2 6-3.8-2.1 4.6-5.7 8-10.2 10-4.8 2.1-10 1.4-15.8-2.1 4.4 1 8.4.8 12-.7-.4-5.3-2.2-10-5.5-14.2Z" fill="currentColor"/>
                    </g>
                  </svg>
                </span>
              </span>
            </button>
          </div>
        </div>
        <div class="input-hint qz:flex qz:min-w-0 qz:items-center qz:justify-between qz:gap-2.5 qz:px-1 qz:pt-0.5 qz:pb-0">
          <span><kbd>Enter</kbd> <span data-i18n="core.send">发送</span> · <kbd>Shift+Enter</kbd> <span data-i18n="core.newline">换行</span></span>
          <span data-ui-slot="composer-meta" class="qz:contents"></span>
        </div>
      </footer>
    </div>

    <!-- capability-ui -->

    <!-- Settings overlay -->
    <div id="settings-panel" class="settings-panel hidden qz:absolute qz:inset-0 qz:z-100 qz:flex qz:items-end qz:justify-center">
      <div class="settings-backdrop qz:absolute qz:inset-0"></div>
      <div class="settings-content qz:relative qz:grid qz:grid-rows-[auto_auto_minmax(0,1fr)_auto] qz:overflow-hidden">
        <div class="settings-header qz:mb-2 qz:flex qz:items-center qz:justify-between">
          <h3 data-i18n="core.settings">设置</h3>
          <button id="btn-close-settings" class="qz-icon-btn qz-icon-btn--md icon-btn" type="button" aria-label="关闭" data-i18n-aria-label="core.close">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="qz-segment settings-tabs qz:mb-2 qz:grid qz:gap-1 qz:p-0.75" role="tablist" aria-label="设置分类" data-i18n-aria-label="core.settingsCategories" data-tab-count="2">

        </div>

        <div id="settings-save-state" class="settings-save-state qz:z-8 qz:grid qz:grid-cols-[minmax(0,1fr)_auto] qz:items-center qz:gap-2.5">
          <div class="settings-status-stack qz:grid qz:min-w-0 qz:gap-1">
            <div id="settings-save-status" class="settings-save-status qz:grid qz:min-w-0 qz:grid-cols-[6px_minmax(0,1fr)] qz:items-start qz:gap-1.75" role="status" aria-live="polite" data-i18n="core.loadingSettings">正在读取配置</div>
            <div id="settings-version-muted" class="settings-version-muted qz:truncate"></div>
          </div>
          <button id="btn-save-settings" class="qz-btn qz-btn--primary " type="button" disabled data-i18n="core.saveSettings">保存配置</button>
        </div>
      </div>
    </div>

  </div>

  <script src="../shared/mathjax-config.js"></script>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
