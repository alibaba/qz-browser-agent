<!doctype html>
<meta charset="utf-8">
<title>Hidden scroll fixture</title>
<style>
  html, body { margin: 0; }
  #scroller { height: 180px; overflow: auto; }
  #inner { height: 2400px; }
  #inner-target, #far-target { height: 40px; }
  #spacer { height: 3200px; }
</style>
<div id="scroller">
  <div id="inner"></div>
  <div id="inner-target">inner</div>
</div>
<div id="spacer"></div>
<div id="far-target">far</div>
